<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>ニュース電光掲示板 LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{height:58px;display:flex;align-items:center;gap:9px;padding:env(safe-area-inset-top) 12px 0;background:#090909;border-bottom:1px solid #292929}
.tag{font-weight:700;font-size:12px;padding:5px 8px;border:1px solid #555;border-radius:6px}.live{color:#ff5656}.mat{color:#ffd85a}
#status{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{height:calc(100% - 58px);display:flex;align-items:center;overflow:hidden}
#ticker{position:absolute;white-space:nowrap;font-size:clamp(28px,7.5vw,70px);font-weight:750;letter-spacing:.02em;transform:translateX(100vw);will-change:transform}
.nhk{color:#f4f4f4}.industry{color:#ffd85a}.sep{color:#555;padding:0 1em}
#help{position:fixed;left:12px;bottom:12px;font-size:11px;color:#777}
#buttons{position:fixed;right:10px;bottom:9px;display:flex;gap:5px;opacity:.35}
button{background:#191919;color:white;border:1px solid #555;border-radius:8px;padding:7px 11px;font-size:15px}
</style>
</head>
<body>
<header><span class="tag live">● LIVE</span><span class="tag">NHK</span><span class="tag mat">材料・素材</span><span id="status">最新ニュースを取得しています…</span></header>
<div id="stage"><div id="ticker"><span class="nhk">最新ニュースを取得しています…</span></div></div>
<div id="help">5分ごとに自動更新</div>
<div id="buttons"><button id="minus">−</button><button id="toggle">Ⅱ</button><button id="plus">＋</button><button id="reload">↻</button></div>
<script>
const feeds=[
 {kind:"nhk", prefix:"【NHK】", url:"https://news.google.com/rss/search?q=site%3Anhk.or.jp%2Fnews&hl=ja&gl=JP&ceid=JP%3Aja"},
 {kind:"industry", prefix:"【材料】", url:"https://news.google.com/rss/search?q=%28%E6%9D%90%E6%96%99+OR+%E7%B4%A0%E6%9D%90+OR+%E9%89%84%E9%8B%BC+OR+%E5%8D%8A%E5%B0%8E%E4%BD%93+OR+%E3%82%BB%E3%83%A9%E3%83%9F%E3%83%83%E3%82%AF%E3%82%B9+OR+%E9%87%91%E5%B1%9E%29+%28%E6%97%A5%E5%88%8A%E5%B7%A5%E6%A5%AD%E6%96%B0%E8%81%9E+OR+site%3Anikkan.co.jp%29&hl=ja&gl=JP&ceid=JP%3Aja"}
];
const api=u=>"https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u);
let speed=75,paused=false,x=innerWidth,last=performance.now();

function clean(t){return (t||"").replace(/\s*-\s*NHK.*$/,"").replace(/\s*-\s*日刊工業新聞.*$/,"").trim()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function getFeed(f){
 const r=await fetch(api(f.url)+"&t="+Date.now(),{cache:"no-store"});
 if(!r.ok) throw new Error("HTTP "+r.status);
 const j=await r.json();
 if(j.status!=="ok"||!j.items) throw new Error("feed");
 return j.items.slice(0,12).map(i=>({kind:f.kind,title:f.prefix+clean(i.title)}));
}
async function update(){
 const st=document.getElementById("status"); st.textContent="更新中…";
 const results=await Promise.allSettled(feeds.map(getFeed));
 let a=[];
 results.forEach(r=>{if(r.status==="fulfilled")a.push(...r.value)});
 const seen=new Set(); a=a.filter(v=>v.title.length>7&&!seen.has(v.title)&&(seen.add(v.title),true));
 if(!a.length){
   document.getElementById("ticker").innerHTML='<span class="nhk">取得に失敗しました。右下の ↻ を押してください。</span>';
   st.textContent="ニュース取得エラー"; return;
 }
 document.getElementById("ticker").innerHTML=a.map(v=>`<span class="${v.kind}">${escapeHtml(v.title)}</span><span class="sep">◆</span>`).join("");
 st.textContent="更新 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
 x=innerWidth;
}
function anim(t){
 if(!paused){
   x-=speed*(t-last)/1000;
   const el=document.getElementById("ticker"), w=el.scrollWidth;
   if(x < -w) x=innerWidth;
   el.style.transform=`translateX(${x}px)`;
 }
 last=t;requestAnimationFrame(anim);
}
document.getElementById("toggle").onclick=()=>{paused=!paused;document.getElementById("toggle").textContent=paused?"▶":"Ⅱ"};
document.getElementById("minus").onclick=()=>speed=Math.max(20,speed-15);
document.getElementById("plus").onclick=()=>speed=Math.min(180,speed+15);
document.getElementById("reload").onclick=update;
update();setInterval(update,300000);requestAnimationFrame(anim);
</script>
<button id="fullscreen" onclick="document.documentElement.requestFullscreen()">⛶ 全画面</button>
</body></html>
