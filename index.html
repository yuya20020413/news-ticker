<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">

<title>NEWS TICKER LIVE</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,"Helvetica Neue",sans-serif;
  overflow:hidden;
}

/* ===== 上部 ===== */

header{
  height:120px;
  background:#090909;
  border-bottom:1px solid #333;
  padding:6px;
  position:relative;
  z-index:10;
}

.title{
  text-align:center;
  color:#999;
  font-size:12px;
  height:18px;
}

/* ===== カテゴリ ===== */

.categories{
  display:flex;
  gap:6px;
}

.cat{
  flex:1;
  height:42px;
  border:2px solid #444;
  border-radius:10px;
  background:#181818;
  color:#aaa;
  font-size:15px;
  font-weight:bold;
}

.cat.active{
  background:#145dcc;
  border-color:#65a0ff;
  color:#fff;
}

/* ===== 設定 ===== */

.controls{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:7px;
}

.controls button{
  height:30px;
  padding:3px 9px;
  background:#191919;
  color:#fff;
  border:1px solid #555;
  border-radius:7px;
  font-size:12px;
}

.controls button.active{
  background:#555;
  border-color:#aaa;
}

/* ===== 電光掲示板 ===== */

#stage{
  position:absolute;
  top:120px;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  flex-direction:column;

  background:#000;
}

.lane{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border-bottom:1px solid #282828;

  user-select:none;
  -webkit-user-select:none;
}

.ticker{
  position:absolute;
  left:0;
  top:50%;

  white-space:nowrap;

  font-size:38px;
  font-weight:bold;

  text-decoration:none;

  transform:translate3d(100vw,-50%,0);

  will-change:transform;
}

/* 色 */

.newsText{
  color:#fff;
}

.weatherText{
  color:#67c9ff;
}

.investmentText{
  color:#ffd447;
}

/* カテゴリ表示 */

.badge{
  font-size:.65em;
  margin-right:14px;
  opacity:.85;
}

/* 状態 */

#status{
  position:fixed;
  right:7px;
  bottom:5px;
  color:#666;
  font-size:10px;
  z-index:20;
}

/* Fire TVでフォーカスが分かる */

button:focus{
  outline:3px solid #fff;
  outline-offset:2px;
}

</style>
</head>

<body>

<header>

<div class="title">
NEWS TICKER LIVE
</div>

<div class="categories">

<button
 id="cat-news"
 class="cat active"
 onclick="toggleCategory('news')">
 📰 ニュース
</button>

<button
 id="cat-weather"
 class="cat"
 onclick="toggleCategory('weather')">
 ☀️ 天気
</button>

<button
 id="cat-investment"
 class="cat"
 onclick="toggleCategory('investment')">
 🏭 設備投資
</button>

</div>


<div class="controls">

<button onclick="slower()">🐢</button>

<button onclick="faster()">🐇</button>

<button onclick="fontDown()">文字−</button>

<button onclick="fontUp()">文字＋</button>


<button
 id="row1"
 class="active"
 onclick="setRows(1)">
1行
</button>

<button
 id="row2"
 onclick="setRows(2)">
2行
</button>

<button
 id="row3"
 onclick="setRows(3)">
3行
</button>


<button
 id="repeat1"
 class="active"
 onclick="setRepeat(1)">
🔁1回
</button>

<button
 id="repeat2"
 onclick="setRepeat(2)">
2回
</button>

</div>

</header>


<div id="stage"></div>

<div id="status">
取得中...
</div>


<script>

/* ========================================
   設定
======================================== */

var selected = {
  news:true,
  weather:false,
  investment:false
};

var speed = 1.5;
var fontSize = 38;
var rows = 1;
var repeatSetting = 1;

var articles = [];
var lanes = [];

var loadNumber = 0;


/* ========================================
   カテゴリ ON / OFF
======================================== */

function toggleCategory(type){

  var activeCount = 0;
  var key;

  for(key in selected){
    if(selected[key]){
      activeCount++;
    }
  }

  /* 最後の1個はOFFにしない */

  if(selected[type] && activeCount === 1){
    return;
  }

  selected[type] = !selected[type];

  updateCategoryButtons();

  loadAllNews();
}


function updateCategoryButtons(){

  var types = [
    "news",
    "weather",
    "investment"
  ];

  var i;

  for(i=0;i<types.length;i++){

    var type = types[i];

    var button =
      document.getElementById(
        "cat-" + type
      );

    if(selected[type]){
      button.className = "cat active";
    }else{
      button.className = "cat";
    }
  }
}


/* ========================================
   API取得
   XMLHttpRequestを使用
   Fire TV互換性を優先
======================================== */

function getCategory(type,callback){

  var xhr = new XMLHttpRequest();

  var url =
    "/api/news?category=" +
    encodeURIComponent(type) +
    "&t=" +
    new Date().getTime();

  xhr.open(
    "GET",
    url,
    true
  );

  xhr.onreadystatechange = function(){

    if(xhr.readyState !== 4){
      return;
    }

    if(
      xhr.status >= 200 &&
      xhr.status < 300
    ){

      try{

        var data =
          JSON.parse(
            xhr.responseText
          );

        var list =
          data.items || data;

        if(
          Object.prototype.toString.call(list)
          !== "[object Array]"
        ){
          list = [];
        }

        callback(
          null,
          list
        );

      }catch(e){

        callback(
          e,
          []
        );
      }

    }else{

      callback(
        new Error(
          "HTTP " + xhr.status
        ),
        []
      );
    }
  };

  xhr.onerror = function(){

    callback(
      new Error("network"),
      []
    );
  };

  xhr.send();
}


/* ========================================
   選択カテゴリを全部取得
======================================== */

function loadAllNews(){

  loadNumber++;

  var thisLoad =
    loadNumber;

  var wanted = [];

  if(selected.news){
    wanted.push("news");
  }

  if(selected.weather){
    wanted.push("weather");
  }

  if(selected.investment){
    wanted.push("investment");
  }


  document.getElementById(
    "status"
  ).innerHTML = "取得中...";


  var results = {};

  var finished = 0;


  function done(){

    finished++;

    if(
      finished !== wanted.length
    ){
      return;
    }

    /*
      古い通信結果だった場合は
      使用しない
    */

    if(thisLoad !== loadNumber){
      return;
    }

    articles =
      mixArticles(
        wanted,
        results
      );

    articles =
      removeDuplicates(
        articles
      );


    document.getElementById(
      "status"
    ).innerHTML =
      articles.length + "件";


    createLanes();
  }


  var i;

  for(i=0;i<wanted.length;i++){

    (function(type){

      getCategory(
        type,
        function(error,list){

          results[type] =
            error ? [] : list;

          /*
            カテゴリ情報を追加
          */

          var j;

          for(
            j=0;
            j<results[type].length;
            j++
          ){

            results[type][j]._category =
              type;
          }

          done();
        }
      );

    })(wanted[i]);
  }
}


/* ========================================
   カテゴリを交互に混ぜる
======================================== */

function mixArticles(
  wanted,
  results
){

  var output = [];

  var max = 0;

  var i;
  var j;


  for(i=0;i<wanted.length;i++){

    var list =
      results[wanted[i]] || [];

    if(list.length > max){
      max = list.length;
    }
  }


  for(i=0;i<max;i++){

    for(j=0;j<wanted.length;j++){

      var type =
        wanted[j];

      var categoryList =
        results[type] || [];

      if(categoryList[i]){

        output.push(
          categoryList[i]
        );
      }
    }
  }


  return output;
}


/* ========================================
   重複削除
======================================== */

function removeDuplicates(list){

  var output = [];

  var seen = {};

  var i;

  for(i=0;i<list.length;i++){

    var item =
      list[i];

    var key =
      item.link ||
      item.url ||
      item.title;

    if(!key){
      continue;
    }

    if(seen[key]){
      continue;
    }

    seen[key] = true;

    output.push(item);
  }

  return output;
}


/* ========================================
   行を作成
======================================== */

function createLanes(){

  stopAllAnimations();

  var stage =
    document.getElementById(
      "stage"
    );

  stage.innerHTML = "";

  lanes = [];

  var i;

  for(i=0;i<rows;i++){

    var element =
      document.createElement(
        "div"
      );

    element.className =
      "lane";

    stage.appendChild(
      element
    );


    var lane = {

      element:element,

      index:i,

      repeatCount:0,

      ticker:null,

      x:0,

      frame:null,

      dragging:false,

      startX:0,

      lastX:0,

      totalMove:0
    };


    lanes.push(lane);

    setupTouch(
      element,
      i
    );

    showArticle(i);
  }
}


/* ========================================
   全アニメーション停止
======================================== */

function stopAllAnimations(){

  var i;

  for(i=0;i<lanes.length;i++){

    if(lanes[i].frame){

      cancelAnimationFrame(
        lanes[i].frame
      );
    }
  }
}


/* ========================================
   記事表示
======================================== */

function showArticle(laneNumber){

  if(!articles.length){
    return;
  }

  var lane =
    lanes[laneNumber];

  if(!lane){
    return;
  }


  if(lane.frame){

    cancelAnimationFrame(
      lane.frame
    );
  }


  var length =
    articles.length;

  var position =
    lane.index % length;

  if(position < 0){
    position += length;
  }


  var article =
    articles[position];


  var ticker =
    document.createElement(
      "a"
    );

  ticker.className =
    "ticker";


  var category =
    article._category ||
    "news";


  if(category === "news"){

    ticker.className +=
      " newsText";

  }else if(
    category === "weather"
  ){

    ticker.className +=
      " weatherText";

  }else{

    ticker.className +=
      " investmentText";
  }


  var prefix = "";

  if(category === "news"){
    prefix = "📰 ";
  }

  if(category === "weather"){
    prefix = "☀️ ";
  }

  if(category === "investment"){
    prefix = "🏭 ";
  }


  ticker.innerHTML =
    '<span class="badge">' +
    prefix +
    '</span>' +
    escapeHTML(
      article.title ||
      "ニュース"
    );


  ticker.href =
    article.link ||
    article.url ||
    "#";


  ticker.target =
    "_blank";


  ticker.style.fontSize =
    fontSize + "px";


  lane.element.innerHTML =
    "";

  lane.element.appendChild(
    ticker
  );


  lane.ticker =
    ticker;

  lane.x =
    lane.element.clientWidth;


  drawTicker(lane);

  animateTicker(
    laneNumber
  );
}


/* ========================================
   HTML安全化
======================================== */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* ========================================
   描画
======================================== */

function drawTicker(lane){

  if(!lane.ticker){
    return;
  }

  lane.ticker.style.transform =
    "translate3d(" +
    lane.x +
    "px,-50%,0)";
}


/* ========================================
   自動スクロール
======================================== */

function animateTicker(
  laneNumber
){

  var lane =
    lanes[laneNumber];

  if(!lane){
    return;
  }


  function frame(){

    if(!lane.dragging){

      lane.x -= speed;

      drawTicker(lane);


      if(
        lane.x <
        -lane.ticker.offsetWidth
        -50
      ){

        lane.repeatCount++;


        if(
          lane.repeatCount >=
          repeatSetting
        ){

          lane.repeatCount = 0;

          lane.index += rows;
        }


        showArticle(
          laneNumber
        );

        return;
      }
    }


    lane.frame =
      requestAnimationFrame(
        frame
      );
  }


  lane.frame =
    requestAnimationFrame(
      frame
    );
}


/* ========================================
   iPhone / タッチ操作
======================================== */

function setupTouch(
  element,
  laneNumber
){

  element.addEventListener(
    "touchstart",
    function(e){

      var lane =
        lanes[laneNumber];

      if(!lane){
        return;
      }

      lane.dragging = true;

      lane.startX =
        e.touches[0].clientX;

      lane.lastX =
        lane.startX;

      lane.totalMove = 0;

    },
    false
  );


  element.addEventListener(
    "touchmove",
    function(e){

      var lane =
        lanes[laneNumber];

      if(!lane){
        return;
      }

      var current =
        e.touches[0].clientX;

      var difference =
        current -
        lane.lastX;

      lane.x +=
        difference;

      lane.totalMove +=
        difference;

      lane.lastX =
        current;

      drawTicker(lane);

    },
    false
  );


  element.addEventListener(
    "touchend",
    function(){

      var lane =
        lanes[laneNumber];

      if(!lane){
        return;
      }

      lane.dragging =
        false;


      if(
        lane.totalMove < -50
      ){

        nextArticle(
          laneNumber
        );

      }else if(
        lane.totalMove > 50
      ){

        previousArticle(
          laneNumber
        );
      }

    },
    false
  );
}


/* ========================================
   次へ
======================================== */

function nextArticle(
  laneNumber
){

  var lane =
    lanes[laneNumber];

  if(!lane){
    return;
  }

  lane.repeatCount = 0;

  lane.index += rows;

  showArticle(
    laneNumber
  );
}


/* ========================================
   前へ
======================================== */

function previousArticle(
  laneNumber
){

  var lane =
    lanes[laneNumber];

  if(!lane){
    return;
  }

  lane.repeatCount = 0;

  lane.index -= rows;

  showArticle(
    laneNumber
  );
}


/* ========================================
   Fire TV リモコン
======================================== */

document.addEventListener(
  "keydown",
  function(e){

    var code =
      e.keyCode ||
      e.which;

    /*
      左：前の記事
      右：次の記事
    */

    if(code === 37){

      previousArticle(0);

    }

    if(code === 39){

      nextArticle(0);

    }
  }
);


/* ========================================
   速度
======================================== */

function slower(){

  speed -= 0.25;

  if(speed < 0.25){
    speed = 0.25;
  }
}


function faster(){

  speed += 0.25;

  if(speed > 8){
    speed = 8;
  }
}


/* ========================================
   文字
======================================== */

function fontDown(){

  fontSize -= 4;

  if(fontSize < 18){
    fontSize = 18;
  }

  updateFont();
}


function fontUp(){

  fontSize += 4;

  if(fontSize > 100){
    fontSize = 100;
  }

  updateFont();
}


function updateFont(){

  var tickers =
    document.getElementsByClassName(
      "ticker"
    );

  var i;

  for(i=0;i<tickers.length;i++){

    tickers[i].style.fontSize =
      fontSize + "px";
  }
}


/* ========================================
   行数
======================================== */

function setRows(number){

  rows = number;

  setActiveButton(
    "row",
    number,
    3
  );

  createLanes();
}


/* ========================================
   表示回数
======================================== */

function setRepeat(number){

  repeatSetting =
    number;

  setActiveButton(
    "repeat",
    number,
    2
  );

  var i;

  for(i=0;i<lanes.length;i++){

    lanes[i].repeatCount =
      0;
  }
}


/* ========================================
   ボタン表示
======================================== */

function setActiveButton(
  prefix,
  selectedNumber,
  maximum
){

  var i;

  for(i=1;i<=maximum;i++){

    var button =
      document.getElementById(
        prefix+i
      );

    if(!button){
      continue;
    }

    if(i === selectedNumber){

      button.className =
        "active";

    }else{

      button.className =
        "";
    }
  }
}


/* ========================================
   Fire TV用
   requestAnimationFrameが不安定な場合の
   フォールバック
======================================== */

window.requestAnimationFrame =
  window.requestAnimationFrame ||
  window.webkitRequestAnimationFrame ||
  function(callback){

    return window.setTimeout(
      callback,
      16
    );
  };


window.cancelAnimationFrame =
  window.cancelAnimationFrame ||
  window.webkitCancelAnimationFrame ||
  function(id){

    clearTimeout(id);
  };


/* ========================================
   起動
======================================== */

updateCategoryButtons();

loadAllNews();


/* 5分ごと更新 */

setInterval(
  loadAllNews,
  300000
);

</script>

</body>
</html>
